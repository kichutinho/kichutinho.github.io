name: Deploy to Pages
on:
  push:
    branches: ["main"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: publish
  cancel-in-progress: false
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Process
        env:
          AC6815: ${{ secrets.AC6815 }}
          B374A0: ${{ secrets.B374A0 }}
        run: |
          python3 -c "
          import os, pathlib, sys
          gm = os.environ.get('AC6815', '')
          bm = os.environ.get('B374A0', '')
          p = pathlib.Path('index.html')
          s = s2 = p.read_text(encoding='utf-8')
          if gm:
              s2 = s2.replace('<!-- 2a2dba3d9410d3eba14545c62c1bd26a -->', gm)
          if bm:
              s2 = s2.replace('<!-- e028b6c04f66d83566187046a3cac93c3b3a5390fd -->', bm)
          if s2 == s and (gm or bm):
              sys.exit(1)
          if s2 != s:
              p.write_text(s2, encoding='utf-8')
          "
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deploy
        uses: actions/deploy-pages@v4
